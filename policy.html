<title>みかん振興課</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho&display=swap">
<style>
/* Layout: a prefectural desk. Status band of indicators on top; left = varieties and pedigree, right = this year's budget and staff-time allocation; year report and share trend below. */
:root{
  --bg:#eceff1; --surface:#fafbfc; --surface-2:#f2f5f7; --sunk:#e3e8ec;
  --ink:#16202b; --ink-2:#4a5a68; --ink-3:#7b8a97;
  --line:#d4dce2; --line-strong:#b6c2cb;
  --accent:#d96c0a; --accent-soft:#fbead9;
  --gov:#1f4e79; --gov-soft:#e3edf6;
  --good:#1d7a4d; --warn:#956405; --bad:#a63421;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --display:"BIZ UDPMincho",'Hiragino Mincho ProN',serif;
  --body:"BIZ UDPGothic",'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#161e26; --surface-2:#1c262f; --sunk:#121a21;
  --ink:#e3eaf0; --ink-2:#a6b5c1; --ink-3:#7a8a97;
  --line:#2a3741; --line-strong:#3a4a56;
  --accent:#f0912e; --accent-soft:#2e2014;
  --gov:#6ba3d6; --gov-soft:#17242f;
  --good:#4fb584; --warn:#d6a32e; --bad:#e2766a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#161e26; --surface-2:#1c262f; --sunk:#121a21;
  --ink:#e3eaf0; --ink-2:#a6b5c1; --ink-3:#7a8a97;
  --line:#2a3741; --line-strong:#3a4a56;
  --accent:#f0912e; --accent-soft:#2e2014;
  --gov:#6ba3d6; --gov-soft:#17242f;
  --good:#4fb584; --warn:#d6a32e; --bad:#e2766a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.35}
h2,h3{font-weight:400}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);
  border-bottom:2px solid var(--gov)}
.hwrap{max-width:1200px;margin:0 auto;padding-block:9px 11px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.brand h1{font-size:1.3rem;letter-spacing:.06em}
.brand .eyebrow{font-size:.72rem;letter-spacing:.1em;color:var(--ink-3);margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;margin-top:9px;
  background:var(--line);border:1px solid var(--line)}
.stat{background:var(--surface-2);padding:6px 9px;min-width:0}
.stat dt{font-size:.67rem;letter-spacing:.06em;color:var(--ink-3);margin:0}
.stat dd{margin:0;font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat dd small{font-family:var(--body);font-size:.66rem;color:var(--ink-3);margin-left:2px}
.stat.share dd{color:var(--accent);font-size:1.3rem}
.neg{color:var(--bad)}
.meter{height:3px;background:var(--sunk);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gov)}
.meter i.a{background:var(--accent)}
.meter i.over{background:var(--bad)}

main{max-width:1200px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
section{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);padding:13px 14px}
.card+.card{margin-top:13px}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:3px 10px;
  margin:-13px -14px 11px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.chead h2{font-size:.96rem;letter-spacing:.04em}
.chead .sub{font-size:.73rem;color:var(--ink-3);font-variant-numeric:tabular-nums;margin:0}

/* 品種 */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px}
.vcard{border:1px solid var(--line);background:var(--surface-2);padding:7px 9px;min-width:0;
  border-left:3px solid var(--line-strong)}
.vcard.own{border-left-color:var(--accent)}
.vcard.mat{border-left-color:var(--gov)}
.vcard.work{border-left-color:var(--warn);border-style:dashed}
.vname{font-family:var(--display);font-size:.92rem;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.vname b{font-weight:400}
.vcross{font-size:.68rem;color:var(--ink-3);margin:1px 0 0;word-break:break-word}
.vstat{display:flex;gap:9px;font-size:.68rem;color:var(--ink-2);margin-top:4px;flex-wrap:wrap}
.vstat span{font-variant-numeric:tabular-nums}
.tag{font-size:.6rem;letter-spacing:.04em;padding:0 5px;border:1px solid var(--line-strong);
  color:var(--ink-3);white-space:nowrap}
.tag.new{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tag.m{color:var(--gov);border-color:var(--gov);background:var(--gov-soft)}
.bar-area{height:5px;background:var(--sunk);margin-top:5px;overflow:hidden}
.bar-area i{display:block;height:100%}

/* 構成バー */
.comp{display:flex;gap:2px;height:24px;margin:2px 0 7px}
.comp i{display:block;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:3px 13px;font-size:.71rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;flex:none}

/* 配分 */
.alloc{margin-bottom:11px}
.alloc>label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--ink-2);
  align-items:baseline}
.alloc>label b{font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{width:100%;margin:3px 0 0;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:3px}
.seg button{background:var(--surface-2);border:0;padding:5px 2px;font-size:.74rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--gov);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:8px 11px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:.8rem}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gov);border-color:var(--gov);color:#fff;font-family:var(--display);
  font-size:.98rem;padding:11px;letter-spacing:.08em}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btnrow .btn{width:auto;flex:1 1 auto;padding:6px 9px;font-size:.75rem}
select{width:100%;padding:6px 8px;font-family:inherit;font-size:.8rem;background:var(--surface-2);
  color:var(--ink);border:1px solid var(--line-strong);margin-top:3px}
.hint{font-size:.71rem;color:var(--ink-3);margin:5px 0 0}

.led{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;padding:3px 0;
  border-bottom:1px dotted var(--line)}
.led:last-child{border-bottom:0}
.led dt{color:var(--ink-2);margin:0}
.led dd{margin:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.led.total{border-top:1px solid var(--line-strong);border-bottom:0;margin-top:4px;padding-top:6px}
.led.total dd{font-family:var(--display);font-size:1rem}

.notice{display:block;font-size:.77rem;padding:6px 9px;background:var(--sunk);
  border-left:3px solid var(--ink-3);margin-top:6px}
.notice.good{border-left-color:var(--good)}
.notice.warn{border-left-color:var(--warn)}
.notice.bad{border-left-color:var(--bad)}
.notice.big{border-left-color:var(--accent);background:var(--accent-soft)}
.notice b{font-weight:700}
.quiet{color:var(--ink-3);font-size:.78rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;margin:9px 0;
  background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--surface-2);padding:7px 9px;min-width:0}
.kpi dt{font-size:.65rem;color:var(--ink-3);margin:0}
.kpi dd{margin:0;font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.kpi dd small{font-family:var(--body);font-size:.64rem;color:var(--ink-3);margin-left:2px}
table{width:100%;border-collapse:collapse;font-size:.75rem}
th,td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:400;color:var(--ink-3);font-size:.67rem;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
td{font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;max-width:100%}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);
  padding:6px 9px;font-size:.73rem;box-shadow:0 4px 14px rgba(0,0,0,.16);min-width:118px;z-index:5}
.tip[hidden]{display:none!important}
.tip .tr{display:flex;justify-content:space-between;gap:10px}
.tip .tr b{font-variant-numeric:tabular-nums}
.verdict{text-align:center;padding:4px 0}
.verdict .rank{font-family:var(--display);font-size:2.2rem;line-height:1.1;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .fadein{animation:fi .3s ease}
  @keyframes fi{from{opacity:.45}to{opacity:1}}
}
</style>
<style>
/* 品種カード中心の画面。1品種＝1カードで、栽培技術と消費者認知に予算を配る */
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:9px}
.vc{border:1px solid var(--line);background:var(--surface-2);padding:9px 11px;min-width:0;
  border-left:3px solid var(--line-strong)}
.vc.on{border-left-color:var(--accent)}
.vc.cold{opacity:.9;border-left-style:dashed}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.vt{font-family:var(--display);font-size:1rem}
.varea{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--ink-2)}
.vsub{font-size:.67rem;color:var(--ink-3);margin:1px 0 6px;word-break:break-word}
.gauge2{display:grid;grid-template-columns:5.8em 1fr 2.6em;align-items:center;gap:6px;
  font-size:.7rem;color:var(--ink-2);margin-top:5px}
.gauge2 .track{height:6px;background:var(--sunk);position:relative;overflow:hidden}
.gauge2 .track i{display:block;height:100%}
.gauge2 .track u{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);text-decoration:none}
.gauge2 b{font-weight:400;font-variant-numeric:tabular-nums;text-align:right;font-family:var(--display)}
.vc input[type=range]{margin:1px 0 0}
.money{font-size:.68rem;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.vfoot{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.66rem;color:var(--ink-3);margin-top:6px;
  padding-top:5px;border-top:1px dotted var(--line)}
.vfoot span{font-variant-numeric:tabular-nums}
.pipe{font-size:.66rem;color:var(--accent)}
#tabbar .seg{grid-template-columns:repeat(4,1fr)}
.hint-tbl td.q{color:var(--ink-3)}
.hint-tbl td.ok{color:var(--accent)}
.hint-tbl tr.dim{opacity:.55}
.hint-tbl td:nth-child(2){white-space:normal}
</style>

<header>
  <div class="hwrap">
    <div class="brand">
      <h1>みかん振興課</h1>
      <p class="eyebrow">県農林水産部 果樹振興係／40年の産地づくり</p>
    </div>
    <dl class="stats">
      <div class="stat"><dt>年度</dt><dd id="s-year">1<small>年目 / 40</small></dd></div>
      <div class="stat share"><dt>全国シェア</dt><dd id="s-share">4.20<small>%</small></dd></div>
      <div class="stat"><dt>当初予算</dt><dd id="s-budget">0<small>/320百万円</small></dd>
        <div class="meter"><i id="m-budget" class="a" style="width:0%"></i></div></div>
      <div class="stat"><dt>県全体の認知</dt><dd id="s-pref">0</dd>
        <div class="meter"><i id="m-pref" style="width:0%"></i></div></div>
      <div class="stat"><dt>栽培品種</dt><dd id="s-count">5<small>品種</small></dd></div>
    </dl>
  </div>
</header>

<main>
  <div class="cols">
    <section>
      <div class="card">
        <div class="chead"><h2>品種と産地</h2><p class="sub" id="v-sub"></p></div>
        <div id="composition"></div>
        <div class="vg" id="varieties" style="margin-top:11px"></div>
      </div>

      <div class="card" id="report-card">
        <div class="chead"><h2 id="r-title">今年度の方針</h2><p class="sub" id="r-sub">1年目</p></div>
        <div id="report"></div>
      </div>

      <div class="card">
        <div class="chead"><h2>シェアの推移</h2><p class="sub">全国の柑橘産出額に占める自県の割合</p></div>
        <div id="records"></div>
      </div>

      <div class="card">
        <div class="chead"><h2 id="tab-title">手引き</h2><p class="sub" id="tab-sub"></p></div>
        <div id="tabbar" style="margin-bottom:11px"></div>
        <div id="howto"></div>
      </div>
    </section>

    <section>
      <div class="card">
        <div class="chead"><h2>育種事業</h2><p class="sub" id="breed-sub"></p></div>
        <div id="breeding"></div>
      </div>

      <div class="card">
        <div class="chead"><h2>今年度予算</h2><p class="sub" id="alloc-sub"></p></div>
        <div id="alloc"></div>
        <button class="btn primary" id="advance" style="margin-top:10px">1年目を終える</button>
        <div class="btnrow" style="margin-top:7px">
          <button class="btn" id="reset">最初から</button>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
(function(){
"use strict";

/* ============ 設定 ============ */
const CFG={
  runYears:40, baseBudget:320, areaTotal:10000, revPerHa:2.3,
  startShare:0.084, nationalGrowth:-0.004,
  maxProjects:3, lagYears:5, convertBase:0.060,
  sportBase:0.030
};
const GEN=[null,{need:180,years:7},{need:240,years:8},{need:320,years:9},{need:420,years:11}];
/* 栽培技術は、その品種につぎ込んだ予算の累計の対数で決まる。
   年あたりの伸びには上限があるので、まとめて注ぎ込んでも一息には上がらない */
const TECH_K=18, TECH_S=6, TECH_MAXRISE=9, TECH_FADE=0.995, AWARE_FADE=0.8;
/* 産地間の価格競争。どの品種も年々値を下げる。自分で育てた品種は満額から、
   よそから買ってきた品種はすでに値崩れが始まったところから始まる */
const PRICE_DECAY=0.982, PRICE_FLOOR=0.55, PRICE_START_MAT=0.85, PRICE_START_OLD=0.78;
/* 品種登録による育成者権。自県が育成・発見した品種は、はじめの10年は値を下げない */
const PROTECT_YEARS=10;
/* 単価が安ければ離農が進み、高ければ少しずつ新植が増える。弱い相関にとどめる */
const SEASONS=["極早生","早生","中生","晩生","春"];
const SEASON_MIN=0.06, SEASON_STEP=0.100, SEASON_PULL=0.45, TECH_SPILL=0.40;
/* 同じ時期に出回る量が多いほど市場で値崩れする。割合ではなく実際の面積で決まるので、
   産地を広げるほど、時期を散らさないと自分で値を崩すことになる */
const GLUT_HA=3600, GLUT_SCALE=18000, GLUT_FLOOR=0.50;
const AREA_SENS=0.050, AREA_DOWN=-0.022, AREA_UP=0.045, AREA_MIN=4000, AREA_MAX=40000;

/* 品種。交配・枝変わりとも農研機構および各県の公表資料にもとづく実在の関係 */
const V={
  miyagawa:{n:"宮川早生",k:"早生温州",s:1,grow:1,yld:1.00,price:1.00,req:0,
    note:"県内の主力。1925年に福岡で在来温州の枝変わりとして見出された。"},
  owari:{n:"尾張温州",k:"普通温州",s:2,grow:1,yld:1.10,price:0.90,req:0,
    note:"晩生の普通温州。温州みかんの基本系統で、多くの優良系統の母体になった。"},

  ponkan:{n:"ポンカン",k:"中晩柑",s:2,grow:1,yld:0.80,price:1.25,req:15,
    note:"インド原産。香りが高く、タンゴール育種の重要な父本。"},

  okitsu:{n:"興津早生",k:"早生温州",s:1,mat:1,grow:1,cost:10,lead:1,orig:"在来",
    yld:1.06,price:0.98,req:28,
    note:"宮川早生の珠心胚実生から選抜された早生温州。多くの枝変わりの母体でもある。"},
  miho:{n:"三保早生",k:"早生温州",s:1,mat:1,grow:1,cost:10,lead:1,orig:"在来",
    yld:1.00,price:0.96,req:28,
    note:"早生温州のひとつ。南香の母本として知られる。"},
  otsu4:{n:"大津四号",k:"中生温州",s:2,mat:1,grow:1,cost:10,lead:1,orig:"高糖系の温州",
    yld:0.95,price:1.30,req:55,
    note:"高糖度で浮皮が出にくい中生温州。隔年結果が出やすく、摘果の手間がかかる。"},
  otsu8:{n:"大津八号",k:"中生温州",s:2,mat:1,grow:1,cost:10,lead:1,orig:"高糖系の温州",
    yld:0.98,price:1.32,req:55,
    note:"高糖系の温州みかん。大分果研4号の母本として使われた。"},
  trovita:{n:"トロビタオレンジ",k:"オレンジ",s:4,mat:1,grow:1,cost:20,lead:2,orig:"米国育成",
    yld:0.70,price:1.20,req:72,
    note:"スイートオレンジ。日本のタンゴール育種はこの父本から始まった。日本では作りにくい。"},
  clementine:{n:"クレメンティン",k:"マンダリン",s:2,mat:1,grow:1,cost:20,lead:2,orig:"地中海",
    yld:0.72,price:1.30,req:72,
    note:"地中海のマンダリン。早熟で種が少ないが、日本の気候には合わせにくい。"},
  encore:{n:"アンコール",k:"マンダリン",s:4,mat:1,grow:1,cost:25,lead:3,orig:"米国育成",
    yld:0.70,price:1.90,req:75,
    note:"米国育成の晩生マンダリン。濃厚な食味を子に伝える。それ自体も高値がつく。"},
  marcott:{n:"マーコット",k:"マンダリン",s:4,mat:1,grow:1,cost:25,lead:3,orig:"米国育成",
    yld:0.72,price:1.85,req:76,
    note:"米国育成。高糖度で果皮が薄いが、種が多く浮皮も出やすい。"},

const CKEY=(a,b)=>[a,b].sort().join("|");
const CROSS={},SPORT={};
Object.keys(V).forEach(id=>{
  if(V[id].cross){const k=CKEY(V[id].cross[0],V[id].cross[1]);(CROSS[k]=CROSS[k]||[]).push(id);}
  if(V[id].sport){(SPORT[V[id].sport]=SPORT[V[id].sport]||[]).push(id);}
});

/* 近縁の品種。親子と、同じ交配・同じ親の枝変わりから出た兄弟 */
const KIN={};
(function(){
  const link=(a,b)=>{if(a===b)return;(KIN[a]=KIN[a]||[]).push(b);(KIN[b]=KIN[b]||[]).push(a);};
  Object.keys(V).forEach(id=>{
    if(V[id].cross) V[id].cross.forEach(p=>link(id,p));
    if(V[id].sport) link(id,V[id].sport);
  });
  const sibs=g=>Object.values(g).forEach(ids=>ids.forEach(a=>ids.forEach(b=>link(a,b))));
  sibs(CROSS); sibs(SPORT);
})();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const ha=n=>Math.round(n).toLocaleString("ja-JP");

/* ============ 状態 ============ */
let state;
function newState(){
  const s={year:1,owned:{},area:{},pipe:{},tech:{},aware:{},techCum:{},pmul:{},born:{},
    alloc:{spend:{}},projects:[],imports:[],slots:{},
    national:0,records:[],last:null,over:false,verdict:null,pick:{a:"",b:""}};
  const init={miyagawa:[5000,55,72,PRICE_START_OLD],owari:[4000,50,62,PRICE_START_OLD],
    ponkan:[1000,42,38,PRICE_START_MAT]};
  Object.keys(init).forEach(id=>{
    s.owned[id]=1; s.area[id]=init[id][0]; s.tech[id]=init[id][1]; s.aware[id]=init[id][2];
    s.techCum[id]=cumFromTech(id,init[id][1]); s.pmul[id]=init[id][3];
    s.pipe[id]=new Array(CFG.lagYears).fill(0); s.alloc.spend[id]=0;
  });
  state=s; s.national=output()/CFG.startShare; s.refPrice=avgPrice(); return s;
}
const SAVE="mikan-policy-v2";
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state));}catch(e){}}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE)||"null");
    if(!s||!s.owned||!s.area||!s.tech||!s.aware||!Array.isArray(s.records)) return null;
    return s;
  }catch(e){return null;}
}

/* ============ 模型 ============ */
function growable(){return Object.keys(state.owned).filter(id=>V[id]&&V[id].grow);}
function pmulOf(id){const v=state.pmul&&state.pmul[id];return v==null?1:v;}
function ownBred(id){return !!(V[id].gen||V[id].sport);}
function protectLeft(id){
  if(!ownBred(id)||!state.born||state.born[id]==null) return 0;
  return Math.max(0,PROTECT_YEARS-(state.year-state.born[id]));
}
function priceOf(id){return V[id].price*pmulOf(id);}
/* 知名度が単価に効く幅は、品種の格によって違う。温州のような日常の品種は
   知られていても値が跳ねないが、優良品種は認知されてはじめて高値がつく */
function awFactor(id){
  const prem=clamp((V[id].price-1.0)/2.5,0,1);
  const span=0.35+prem*0.75;
  return (1-span*0.45)+effAware(id)/100*span;
}
function techDiff(id){return 1+(V[id].req||0)/120;}
/* その品種に配った予算は、育ち具合に応じて栽培技術と消費者PRへ自動で割れる。
   植えられる水準に届くまでは技術へ、育ってからはPRへ重心が移る */
function needOf(id){return V[id].req||55;}
function splitOf(id){
  const t=state.tech[id]||0, need=needOf(id);
  if(t<need*0.6) return [1,0];
  if(t<need) return [0.7,0.3];
  return [0.3,0.7];
}
function spendOf(id){return (state.alloc.spend&&state.alloc.spend[id])||0;}
function techSpend(id){return spendOf(id)*splitOf(id)[0];}
function prSpend(id){return spendOf(id)*splitOf(id)[1];}
/* 近縁品種の栽培暦は流用できる。最も進んだ近縁の4割までは、予算なしで届く */
function kinTech(id,src){
  const k=KIN[id]; if(!k) return 0;
  const t=src||state.tech;
  let best=0; k.forEach(x=>{if(state.owned[x])best=Math.max(best,(t[x]||0));});
  return best*TECH_SPILL;
}
function techFromCum(id,cum){return Math.min(100,TECH_K*Math.log(1+Math.max(0,cum)/(TECH_S*techDiff(id))));}
function cumFromTech(id,t){return TECH_S*techDiff(id)*(Math.exp(t/TECH_K)-1);}
function pipeOf(id){return state.pipe[id]||(state.pipe[id]=new Array(CFG.lagYears).fill(0));}
function pipeSum(id){return pipeOf(id).reduce((a,b)=>a+b,0);}
/* 県全体の認知。主力品種の知名度が他の品種を引き上げる */
function prefAware(){
  let s=0,a=0;
  growable().forEach(id=>{const ar=state.area[id]||0;s+=ar;a+=ar*(state.aware[id]||0);});
  return s>0?a/s:0;
}
function effAware(id){
  const own=state.aware[id]||0,pf=prefAware();
  return clamp(Math.max(own,pf*0.55)+pf*0.15,0,100);
}
/* 出荷期ごとの作付割合。周年で棚を押さえられる産地ほど単価が上がる */
function seasonShares(){
  const by=[0,0,0,0,0]; let tot=0;
  growable().forEach(id=>{const a=state.area[id]||0;const si=V[id].s;
    if(a<=0||si==null)return; by[si]+=a; tot+=a;});
  return tot>0?by.map(a=>a/tot):by;
}
function seasonCover(){return seasonShares().filter(x=>x>=SEASON_MIN).length;}
/* その時期に出回る面積そのもので値が決まる */
function seasonAreas(){
  const by=[0,0,0,0,0];
  growable().forEach(id=>{const a=state.area[id]||0,si=V[id].s;
    if(a>0&&si!=null) by[si]+=a;});
  return by;
}
function glutFactor(si){
  if(si==null) return 1;
  const a=seasonAreas()[si]||0;
  return a<=GLUT_HA?1:Math.max(GLUT_FLOOR,1-(a-GLUT_HA)/GLUT_SCALE);
}
function seasonBonus(){return 1+SEASON_STEP*Math.max(0,seasonCover()-1);}
function output(){
  let o=0;
  growable().forEach(id=>{
    const v=V[id],ar=state.area[id]||0; if(ar<=0) return;
    const t=state.tech[id]||0;
    const ty=0.62+t/100*0.95;
    const q=v.req?(t>=v.req?1:0.60+t/v.req*0.40):1;
    o+=ar*CFG.revPerHa*v.yld*priceOf(id)*ty*q*awFactor(id)*glutFactor(v.s);
  });
  return o*seasonBonus();
}
function share(){return state.national>0?output()/state.national:0;}
/* 産地が植えたくなる度合い。栽培法が確立していない品種は誰も植えない */
function appeal(id){
  const v=V[id],t=state.tech[id]||0,a=effAware(id),need=v.req||1;
  if(v.req&&t<v.req*0.6) return 0.02;
  const tf=clamp(t/need,0,1.25),af=0.25+a/100*1.15;
  let gap=1;
  if(v.s!=null){const sh=seasonShares()[v.s]||0;gap=1+(1-clamp(sh/SEASON_MIN,0,1))*SEASON_PULL;}
  return priceOf(id)*v.yld*tf*af*gap*glutFactor(v.s);
}
/* 面積加重の実効単価。着任時を1.0とした比で面積が動く */
function avgPrice(){
  let a=0,w=0;
  growable().forEach(id=>{const ar=state.area[id]||0;if(ar<=0)return;
    w+=ar; a+=ar*priceOf(id)*awFactor(id);});
  return w>0?a/w:0;
}
function totalArea(){return growable().reduce((s,id)=>s+(state.area[id]||0)+pipeSum(id),0);}
function adjustTotalArea(){
  const ref=state.refPrice||1, r=avgPrice()/ref;
  const g=clamp((r-1)*AREA_SENS,AREA_DOWN,AREA_UP);
  const cur=totalArea();
  let delta=cur*g;
  if(cur+delta<AREA_MIN) delta=AREA_MIN-cur;
  if(cur+delta>AREA_MAX) delta=AREA_MAX-cur;
  if(Math.abs(delta)<0.01) return 0;
  if(delta<0){
    /* 離農は条件の悪い園から先に出る */
    let need=-delta;
    const ids=growable().filter(id=>(state.area[id]||0)>0).sort((a,b)=>appeal(a)-appeal(b));
    for(const id of ids){
      const take=Math.min(state.area[id],need);
      state.area[id]-=take; need-=take;
      if(need<=0.01) break;
    }
    return -( -delta-need );
  }
  const ids=growable().slice().sort((a,b)=>appeal(b)-appeal(a));
  if(ids.length) pipeOf(ids[0])[CFG.lagYears-1]+=delta;
  return delta;
}
function convertRate(){
  const ids=growable(); let ar=0,tw=0,aw=0;
  ids.forEach(id=>{const a=state.area[id]||0;ar+=a;tw+=a*(state.tech[id]||0);aw+=a*effAware(id);});
  const t=ar?tw/ar:0,a=ar?aw/ar:0;
  return CFG.convertBase*(0.20+t/100*0.55+a/100*0.45);
}
/* 改植は結果樹になるまで数年かかる。減る分はすぐ、増える分は遅れて効く */
function convertAreas(){
  const ids=growable();
  const total=ids.reduce((s,id)=>s+(state.area[id]||0)+pipeSum(id),0)||CFG.areaTotal;
  const ap=ids.map(id=>Math.pow(appeal(id),2.6));
  const sum=ap.reduce((a,b)=>a+b,0)||1;
  const target={}; ids.forEach((id,i)=>target[id]=total*ap[i]/sum);
  const move=total*convertRate();
  const def=[],sur=[];
  ids.forEach(id=>{
    const cur=(state.area[id]||0)+pipeSum(id),d=target[id]-cur;
    if(d>0)def.push([id,d]); else if(-d>0&&(state.area[id]||0)>0)sur.push([id,Math.min(-d,state.area[id])]);
  });
  const ds=def.reduce((a,x)=>a+x[1],0),ss=sur.reduce((a,x)=>a+x[1],0);
  const amt=Math.min(move,ds,ss);
  if(amt<=0.01) return 0;
  sur.forEach(([id,s])=>{state.area[id]=Math.max(0,(state.area[id]||0)-amt*s/ss);});
  def.forEach(([id,d])=>{const p=pipeOf(id);p[CFG.lagYears-1]+=amt*d/ds;});
  return amt;
}
function advancePipes(){
  let came=0;
  growable().forEach(id=>{
    const p=pipeOf(id);
    came+=p[0]; state.area[id]=(state.area[id]||0)+p[0];
    for(let i=0;i<p.length-1;i++) p[i]=p[i+1];
    p[p.length-1]=0;
  });
  return came;
}
/* 枝変わりは園地で偶然見つかる。面積が広いほど、技術が高いほど見つかりやすい */
function sportChance(id){
  const list=SPORT[id]; if(!list||!list.some(s=>!state.owned[s])) return 0;
  const ar=state.area[id]||0,t=state.tech[id]||0;
  return CFG.sportBase*(ar/800)*(0.5+t/100*0.5);
}
function budgetOf(){
  const g=1+(share()-CFG.startShare)/CFG.startShare*0.6;
  return Math.max(80,Math.round(CFG.baseBudget*g));
}
function crossOutcomes(a,b){return (a&&b&&a!==b)?(CROSS[CKEY(a,b)]||[]):[];}
function crossRemaining(a,b){return crossOutcomes(a,b).filter(id=>!state.owned[id]);}
/* その母本と組んで、まだ系統が残っている相手 */
function crossPartners(a){
  if(!a) return [];
  return Object.keys(state.owned).filter(b=>V[b]&&b!==a&&crossRemaining(a,b).length);
}
function projectGen(a,b){const o=crossOutcomes(a,b);return o.length?V[o[0]].gen:0;}
function plan(){
  const b=budgetOf();
  let tech=0,pr=0;
  growable().forEach(id=>{tech+=techSpend(id);pr+=prSpend(id);});
  let breed=0; state.projects.forEach(p=>breed+=p.budget);
  const imp=state.imports.filter(i=>i.fresh).reduce((a,i)=>a+V[i.id].cost,0);
  const cost=tech+pr+breed+imp;
  return {budget:b,tech,pr,breed,imp,cost,left:b-cost,over:Math.max(0,cost-b)};
}

/* ============ 年度を終える ============ */
function advanceYear(){
  if(state.over) return;
  const p=plan(); if(p.over>0) return;
  const notices=[],before={share:share(),pref:prefAware()};
  const newV=[],sports=[];

  const prevTech={}; growable().forEach(id=>prevTech[id]=state.tech[id]||0);
  growable().forEach(id=>{
    const c=techSpend(id);
    if(c>0) state.techCum[id]=(state.techCum[id]||0)+c;
    else state.techCum[id]=(state.techCum[id]||0)*TECH_FADE;
    const target=Math.max(techFromCum(id,state.techCum[id]),kinTech(id,prevTech));
    state.tech[id]=clamp(Math.min(target,(state.tech[id]||0)+TECH_MAXRISE),0,100);
  });
  growable().forEach(id=>{
    if(protectLeft(id)>0) return;
    state.pmul[id]=Math.max(PRICE_FLOOR,pmulOf(id)*PRICE_DECAY);
  });
  const pf=prefAware();
  growable().forEach(id=>{
    const c=prSpend(id);
    if(c>0) state.aware[id]=clamp((state.aware[id]||0)
      +4.2*Math.sqrt(c/30)*(1-(state.aware[id]||0)/100)*(1+pf/100*0.6),0,100);
    state.aware[id]=clamp((state.aware[id]||0)-AWARE_FADE,0,100);
  });

  state.projects.forEach(pj=>{
    pj.years++; pj.cum+=pj.budget;
    const g=GEN[pj.gen]||GEN[1];
    if(pj.years>=g.years&&pj.cum>=g.need){
      const prob=0.25+Math.min(0.35,(pj.cum/g.need-1)*0.45);
      if(Math.random()<prob){
        const rem=crossRemaining(pj.a,pj.b);
        if(rem.length){
          const got=rem[Math.floor(Math.random()*rem.length)];
          acquire(got);pj.done=got;newV.push(got);
        }else pj.done="none";
      }
    }
  });
  state.projects=state.projects.filter(pj=>{
    if(!pj.done) return true;
    if(pj.done==="none") notices.push({t:"warn",msg:"<b>"+V[pj.a].n+" × "+V[pj.b].n
      +"</b> の交配からは、これ以上新しい系統は得られませんでした。"});
    return false;
  });

  growable().slice().forEach(id=>{
    if(Math.random()<sportChance(id)){
      const cand=(SPORT[id]||[]).filter(s=>!state.owned[s]);
      if(cand.length){acquire(cand[0]);sports.push([id,cand[0]]);}
    }
  });

  state.imports.forEach(i=>{i.fresh=false;i.left--;});
  state.imports.filter(i=>i.left<=0).forEach(i=>{
    acquire(i.id);
    notices.push({t:"good",msg:"<b>"+V[i.id].n+"</b> を導入しました。"+esc(V[i.id].note)
      +"　交配の親に使えるほか、そのまま栽培もできます。"});
  });
  state.imports=state.imports.filter(i=>i.left>0);

  const came=advancePipes();
  const moved=convertAreas();
  const land=adjustTotalArea();
  state.national*=1+CFG.nationalGrowth+(Math.random()-0.5)*0.006;
  const sh=share();

  newV.forEach(id=>{const v=V[id];
    notices.push({t:"big",msg:"新品種 <b>「"+v.n+"」</b> を育成しました（"
      +v.cross.map(c=>V[c].n).join(" × ")+"）。"+esc(v.note)
      +(state.tech[id]>1?"　親ゆずりの栽培知見で、技術 <b>"+state.tech[id].toFixed(0)
        +"</b> から始まります。":"　栽培技術も知名度もゼロからです。")});});
  sports.forEach(([from,id])=>{const v=V[id];
    notices.push({t:"big",msg:"<b>"+V[from].n+"</b> の園地で"+(v.how||"枝変わり")
      +"が見つかりました。<b>「"+v.n+"」</b>です。"+esc(v.note)
      +"　交配ではないので、育種予算はかかりません。"});});
  if(came>1) notices.push({t:"good",msg:"5年前に改植した <b>"+ha(came)
    +"ha</b> が結果樹になりました。"});
  if(land<-1) notices.push({t:"warn",msg:"単価の安さに耐えかねて、<b>"+ha(-land)
    +"ha</b> が離農しました。条件の悪い園地から順に手放されています。"});
  else if(land>1) notices.push({t:"good",msg:"単価が戻り、<b>"+ha(land)
    +"ha</b> の新植が入りました。結果樹になるのは"+CFG.lagYears+"年後です。"});
  if(sh<before.share) notices.push({t:"warn",msg:"他県も産地づくりを進めています。手を止めるとシェアは下がります。"});
  const stuck=growable().filter(id=>V[id].req&&(state.tech[id]||0)<V[id].req*0.6
    &&(state.area[id]||0)+pipeSum(id)<5);
  if(stuck.length) notices.push({t:"warn",msg:"<b>"+stuck.map(id=>V[id].n).join("・")
    +"</b> は栽培法が固まっておらず、だれも植えていません。"});

  state.records.push({year:state.year,share:sh,output:output(),budget:p.budget,
    pref:prefAware(),varieties:growable().length,
    bred:growable().filter(id=>V[id].gen||V[id].sport).length});
  state.last={year:state.year,notices,p,before,after:{share:sh,pref:prefAware()},came,moved,land};
  state.year++;
  fitAllocation();

  if(state.year>CFG.runYears&&!state.verdict){
    const s=sh*100;
    const t=[[38.0,"秀","全国を代表する産地","シェア "+s.toFixed(2)+"%。品種・栽培技術・知名度が噛み合い、産地の形が変わりました。"],
             [31.0,"優","確かな前進","シェア "+s.toFixed(2)+"%。新しい品種が産地に根づき、値崩れを大きく上回りました。"],
             [23.0,"良","着実な積み上げ","シェア "+s.toFixed(2)+"%。更新が値崩れに勝ちました。集中を強めれば、もう一段伸びます。"],
             [8.4,"並","着任時のシェアを守った","シェア "+s.toFixed(2)+"%。品種は年々値を下げます。そのなかで守り切ったのは健闘です。"]]
      .find(x=>s>=x[0])||[0,"—","産地の後退","シェア "+s.toFixed(2)+"%。古い品種を作り続けるあいだに、産地が細りました。"];
    state.verdict={rank:t[1],title:t[2],body:t[3]};
    state.over=true;
  }
  save(); renderAll();
  const rc=$("report-card"); rc.classList.remove("fadein"); void rc.offsetWidth; rc.classList.add("fadein");
}
/* 新年度の予算に収まるよう、前年度の配分を比例で縮める */
function fitAllocation(){
  let guard=0;
  while(plan().over>0&&guard++<40){
    const p=plan(),k=p.budget/Math.max(1,p.cost);
    growable().forEach(id=>{
      state.alloc.spend[id]=Math.floor(spendOf(id)*k/5)*5;
    });
    state.projects.forEach(pj=>{pj.budget=Math.floor(pj.budget*k/5)*5;});
    if(plan().over>0&&k>0.99){
      const t=growable().filter(id=>spendOf(id)>0);
      if(t.length) state.alloc.spend[t[0]]-=5; else break;
    }
  }
}
/* 親品種の栽培知見は子に引き継がれる。枝変わりは同じ系統なので、より多く残る */
function acquire(id){
  const v=V[id];
  const par=v.cross||(v.sport?[v.sport]:[]);
  const rate=v.sport?0.60:0.35;
  let t=0; par.forEach(pid=>{t=Math.max(t,(state.tech[pid]||0)*rate);});
  state.owned[id]=1; state.area[id]=0; state.aware[id]=0;
  state.tech[id]=t; state.techCum[id]=cumFromTech(id,t);
  if(!state.pmul)state.pmul={};
  if(!state.born)state.born={};
  state.pmul[id]=v.mat?PRICE_START_MAT:1;
  state.born[id]=state.year;
  state.pipe[id]=new Array(CFG.lagYears).fill(0);
  state.alloc.spend[id]=0;
  return t;
}

/* ============ 描画 ============ */
function slotOf(id){
  if(!state.slots) state.slots={};
  if(state.slots[id]==null){
    const used=Object.values(state.slots);
    let n=0; while(used.indexOf(n)>=0&&n<6) n++;
    state.slots[id]=n;
  }
  return state.slots[id];
}

function renderBreeding(){
  const p=plan();
  $("breed-sub").textContent="進行中 "+state.projects.length+"/"+CFG.maxProjects+"・"+p.breed+"百万円";
  let h="";
  state.projects.forEach((pj,i)=>{
    const g=GEN[pj.gen]||GEN[1];
    const ready=pj.years>=g.years&&pj.cum>=g.need;
    h+='<div class="vc cold" style="margin-bottom:9px">'
      +'<div class="vhead"><span class="vt">'+esc(V[pj.a].n)+' × '+esc(V[pj.b].n)+'</span>'
      +(ready?'<span class="tag new">選抜中</span>':'<span class="tag">第'+pj.gen+'世代</span>')+'</div>'
      +gauge("予算",Math.min(100,pj.cum/g.need*100),"var(--accent)")
      +gauge("年数",Math.min(100,pj.years/g.years*100),"var(--gov)")
      +'<div class="money"><span>'+Math.round(pj.cum)+' / '+g.need+'百万円</span>'
      +'<span>'+pj.years+' / '+g.years+'年</span></div>'
      +'<input type="range" data-pb="'+i+'" min="0" max="150" step="5" value="'+pj.budget+'">'
      +'<div class="money"><span>今年度</span><span>'+pj.budget+'百万円</span></div>'
      +'<div class="btnrow" style="margin-top:6px"><button class="btn" data-act="stop" data-i="'+i
      +'">打ち切る</button></div>'
      +(ready?'<p class="vsub" style="margin:6px 0 0">条件を満たしました。毎年、有望個体が'
        +'選抜される可能性があります。予算を厚くすると確率が上がります。</p>':'')
      +'</div>';
  });
  /* 成立しない組合せは選択肢に出さない */
  const parents=Object.keys(state.owned).filter(id=>V[id]&&crossPartners(id).length);
  let a=state.pick.a; if(a&&parents.indexOf(a)<0){a="";state.pick.a="";state.pick.b="";}
  const mates=crossPartners(a);
  let b=state.pick.b; if(b&&mates.indexOf(b)<0){b="";state.pick.b="";}
  const opt=(ids,sel)=>'<option value="">—</option>'+ids.map(id=>'<option value="'+id+'"'
    +(sel===id?' selected':'')+'>'+esc(V[id].n)+'</option>').join("");
  const rem=crossRemaining(a,b);
  let verdict,can=false;
  if(!parents.length) verdict='<div class="notice">いま持っている品種では、新しい系統を狙える'
    +'組合せがありません。遺伝資源を導入するか、育成した品種を親に使ってください。</div>';
  else if(!a) verdict='<p class="hint">母本を選んでください。父本は、その母本と組める品種だけが並びます。</p>';
  else if(!b) verdict='<p class="hint">父本を選んでください。ここに並ぶのは、まだ系統が残っている'
    +'組合せだけです。</p>';
  else{
    const g=GEN[projectGen(a,b)];
    verdict='<div class="notice good">最短 <b>'+g.years+'年</b>・累計 <b>'+g.need
      +'百万円</b> が目安です。この組合せからは、まだ <b>'+rem.length+'系統</b> が期待できます'
      +(rem.length>1?'。どれが選抜されるかは分かりません':'')+'。</div>';
    can=state.projects.length<CFG.maxProjects;
  }
  h+='<div class="alloc"><label>母本</label><select id="pick-a">'+opt(parents,a)+'</select></div>'
    +(a?'<div class="alloc"><label>父本</label><select id="pick-b">'+opt(mates,b)+'</select></div>':'')
    +verdict
    +'<button class="btn" data-act="start" style="margin-top:7px"'+(can?"":" disabled")+'>交配を始める</button>'
    +(state.projects.length>=CFG.maxProjects?'<p class="hint">同時に進められるのは'
      +CFG.maxProjects+'課題までです。</p>':'');
  $("breeding").innerHTML=h;
}

  const rows=Object.keys(CROSS).map(k=>{

/* ---- シェアの推移 ---- */
const VB={w:760,h:220,l:46,r:54,t:14,b:28};
let chartData=null;
function renderRecords(){
  const el=$("records"),rs=state.records;
  if(!rs.length){
    el.innerHTML='<p class="quiet">まだ記録がありません。1年目を終えると、シェアの推移がここに残ります。</p>';
    chartData=null; return;
  }
  const vals=rs.map(r=>r.share*100).concat([CFG.startShare*100]);
  let yMax=Math.max(...vals)*1.06,yMin=Math.min(...vals)*0.94;
  if(yMax-yMin<0.6){yMax+=0.3;yMin-=0.3;}
  const lastX=Math.max(10,rs[rs.length-1].year);
  const px=y=>VB.l+(y-1)/(lastX-1)*(VB.w-VB.l-VB.r);
  const py=v=>VB.t+(yMax-v)/(yMax-yMin)*(VB.h-VB.t-VB.b);
  const last=rs[rs.length-1];
  let s='<svg viewBox="0 0 '+VB.w+' '+VB.h+'" role="img" aria-label="全国シェアの推移">';
  for(let i=0;i<=4;i++){
    const v=yMin+(yMax-yMin)*i/4;
    s+='<line x1="'+VB.l+'" y1="'+py(v).toFixed(1)+'" x2="'+(VB.w-VB.r)+'" y2="'+py(v).toFixed(1)
      +'" stroke="var(--line)" stroke-width="1"/>'
      +'<text x="'+(VB.l-8)+'" y="'+(py(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" '
      +'fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">'+v.toFixed(1)+'</text>';
  }
  const base=CFG.startShare*100;
  if(base>=yMin&&base<=yMax)
    s+='<line x1="'+VB.l+'" y1="'+py(base).toFixed(1)+'" x2="'+(VB.w-VB.r)+'" y2="'+py(base).toFixed(1)
      +'" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="4 4"/>'
      +'<text x="'+(VB.w-VB.r+6)+'" y="'+(py(base)+4).toFixed(1)+'" font-size="11" fill="var(--ink-3)">着任時</text>';
  const xt=[1];for(let y=10;y<=lastX;y+=10)xt.push(y);
  if(xt.indexOf(last.year)<0)xt.push(last.year);
  xt.forEach(y=>{s+='<text x="'+px(y).toFixed(1)+'" y="'+(VB.h-9)+'" text-anchor="middle" font-size="11" '
    +'fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">'+y+'</text>';});
  s+='<text x="'+(VB.l-8)+'" y="'+(VB.t-2)+'" text-anchor="end" font-size="10" fill="var(--ink-3)">%</text>';
  s+='<g id="ch-cross" opacity="0"><line id="ch-line" y1="'+VB.t+'" y2="'+(VB.h-VB.b)
    +'" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>'
    +'<circle id="ch-d" r="4.5" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/></g>';
  s+='<polyline points="'+rs.map(r=>px(r.year).toFixed(1)+","+py(r.share*100).toFixed(1)).join(" ")
    +'" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<circle cx="'+px(last.year).toFixed(1)+'" cy="'+py(last.share*100).toFixed(1)
    +'" r="4" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>'
    +'<text x="'+(px(last.year)+9).toFixed(1)+'" y="'+(py(last.share*100)+4).toFixed(1)
    +'" font-size="12" fill="var(--ink-2)">'+(last.share*100).toFixed(2)+'%</text>';
  s+='<rect id="ch-hit" x="'+VB.l+'" y="'+VB.t+'" width="'+(VB.w-VB.l-VB.r)+'" height="'+(VB.h-VB.t-VB.b)
    +'" fill="transparent" style="cursor:crosshair"/></svg>';
  el.innerHTML='<div class="chartwrap" id="chartwrap">'+s+'<div class="tip" id="tip" hidden></div></div>'
    +'<div class="scroll" style="max-height:230px;overflow-y:auto;margin-top:10px">'
    +'<table><thead><tr><th>年度</th><th>シェア</th><th>産出額</th><th>予算</th>'
    +'<th>県の認知</th><th>品種数</th></tr></thead><tbody>'
    +rs.slice().reverse().map(r=>'<tr><td>'+r.year+'</td><td>'+(r.share*100).toFixed(2)+'%</td><td>'
      +ha(r.output)+'</td><td>'+r.budget+'</td><td>'+r.pref.toFixed(0)+'</td><td>'+r.varieties
      +'</td></tr>').join("")+'</tbody></table></div>';
  chartData={rs,px,py}; bindChart();
}
function bindChart(){
  const hit=$("ch-hit");if(!hit||!chartData)return;
  const wrap=$("chartwrap"),tip=$("tip"),cross=$("ch-cross");
  const show=ev=>{
    const svg=wrap.querySelector("svg"),rect=svg.getBoundingClientRect();
    if(!rect.width)return;
    const sc=rect.width/VB.w,vx=(ev.clientX-rect.left)/sc;
    const {rs,px,py}=chartData;
    let best=rs[0],bd=Infinity;
    rs.forEach(r=>{const d=Math.abs(px(r.year)-vx);if(d<bd){bd=d;best=r;}});
    cross.setAttribute("opacity","1");
    $("ch-line").setAttribute("x1",px(best.year));$("ch-line").setAttribute("x2",px(best.year));
    $("ch-d").setAttribute("cx",px(best.year));$("ch-d").setAttribute("cy",py(best.share*100));
    tip.hidden=false;
    tip.innerHTML='<div style="font-family:var(--display);margin-bottom:3px">'+best.year+'年度</div>'
      +'<div class="tr"><span>シェア</span><b>'+(best.share*100).toFixed(2)+'%</b></div>'
      +'<div class="tr"><span>県の認知</span><b>'+best.pref.toFixed(0)+'</b></div>'
      +'<div class="tr"><span>栽培品種</span><b>'+best.varieties+'</b></div>';
    const lx=px(best.year)*sc,tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(wrap.clientWidth-tw,lx-tw/2))+"px";
    tip.style.top="4px";
  };
  hit.addEventListener("pointermove",show);
  hit.addEventListener("pointerdown",show);
  hit.addEventListener("pointerleave",()=>{tip.hidden=true;cross.setAttribute("opacity","0");});
}

  });
  document.addEventListener("click",e=>{
    const tb=e.target.closest("[data-tab]");
    if(tb){state.tab=tb.dataset.tab;save();renderTabs();return;}
    const act=e.target.closest("[data-act]");
    if(!act||act.disabled)return;
    const a=act.dataset.act;
    if(a==="start"){
      const {a:x,b:y}=state.pick;
      if(crossRemaining(x,y).length&&state.projects.length<CFG.maxProjects){
        state.projects.push({a:x,b:y,gen:projectGen(x,y),cum:0,years:0,budget:40});
        state.pick={a:"",b:""};
      }
    }
    if(a==="stop") state.projects.splice(+act.dataset.i,1);
    if(a==="import"){
      const id=act.dataset.id;
      if(V[id]&&V[id].mat&&!state.owned[id]) state.imports.push({id,left:V[id].lead,fresh:true});
    }
    save();renderAll();
  });
  $("advance").addEventListener("click",()=>advanceYear());
  const rb=$("reset");
  rb.addEventListener("click",()=>{
    if(!resetArmed){resetArmed=true;rb.textContent="もう一度押すと1年目に戻ります";
      setTimeout(()=>{resetArmed=false;rb.textContent="最初から";},4000);return;}
    resetArmed=false;rb.textContent="最初から";
    newState();try{localStorage.removeItem(SAVE);}catch(e){}
    save();renderAll();
  });
}
function boot(data){
  const s=(data&&data.state)||load();
  if(s)state=s; else newState();
  if(!state.pick)state.pick={a:"",b:""};
  if(!state.tab)state.tab="howto";
  if(!state.slots)state.slots={};
  if(!state.pmul)state.pmul={};
  if(!state.born)state.born={};
  if(!state.refPrice)state.refPrice=avgPrice()||1;
  growable().forEach(id=>{if(state.pmul[id]==null)state.pmul[id]=V[id].mat?PRICE_START_MAT:1;});
  if(!state.techCum)state.techCum={};
  growable().forEach(id=>{if(state.techCum[id]==null)state.techCum[id]=cumFromTech(id,state.tech[id]||0);});
  if(!state.alloc)state.alloc={spend:{}};
  if(!state.alloc.spend){
    const old=state.alloc; state.alloc={spend:{}};
    Object.keys(state.owned).forEach(id=>{
      state.alloc.spend[id]=((old.tech&&old.tech[id])||0)+((old.pr&&old.pr[id])||0);});
  }
  growable().forEach(id=>{if(!state.pipe[id])state.pipe[id]=new Array(CFG.lagYears).fill(0);});
  if(!state.national)state.national=output()/CFG.startShare;
  bindOnce();renderAll();
}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==="function"){try{hot.snapshot(()=>({state}));}catch(e){}}
if(hot&&typeof hot.ready==="function"){hot.ready(boot);}else{boot(hot&&hot.data?hot.data:{});}
})();
</script>
